name: Update TAU Schedule

on:
  schedule:
    - cron: '0 4 * * *'  # Every day at 06:00 Israel time
  workflow_dispatch:     # Allow manual run from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape latest TAU schedule from IMS
        run: python3 scraper.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "chore: update TAU schedule"
          git push
